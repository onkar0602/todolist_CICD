
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My_To-Do_List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="todo-container">
        <header>
            <p class="eyebrow">MY PRODUCTIVITY</p>
            <h1>My_To-DO_List</h1>
            <p class="subtitle">Small stepss, big progress.</p>
        </header>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="What do you need to do or Work ?"
                maxlength="200"
                autocomplete="off"
                required
            >
            <button type="submit" id="add-button">Add Task</button>
        </form>

        <p id="message" role="status"></p>

        <section class="task-section">
            <div class="task-heading">
                <h2>Your tasks</h2>
                <span id="task-count">0 tasks</span>
            </div>

            <ul id="task-list"></ul>

            <p id="empty-message">No tasks yet. Add your first task!</p>
        </section>

        <footer>
            <span>Stay focused. Keep going.</span>
        </footer>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
